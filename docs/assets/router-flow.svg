<svg xmlns="http://www.w3.org/2000/svg" width="1192" height="476" viewBox="0 0 1192 476" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How the /duolingo router turns a question into one or two skills: gate, posture, family, answer</title>
<defs>
<filter id="routerflow-lift" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
</filter>
<linearGradient id="routerflow-rule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#58CC02"/><stop offset="0.28" stop-color="#1CB0F6"/>
  <stop offset="0.58" stop-color="#CE82FF"/><stop offset="0.82" stop-color="#FF9600"/>
  <stop offset="1" stop-color="#FF4B4B"/>
</linearGradient>
<clipPath id="routerflow-cap"><rect x="0" y="0" width="262" height="218" rx="12"/></clipPath>
<clipPath id="routerflow-banner-cap"><rect x="0" y="0" width="1120" height="64" rx="12"/></clipPath>
</defs>
<rect width="1192" height="476" fill="#0b0e14"/>
<rect x="0" y="0" width="1192" height="3" fill="url(#routerflow-rule)"/>
<text x="36" y="56" fill="#e9eef5" font-size="26" font-weight="700">How a question becomes one or two skills</text>
<text x="36" y="82" fill="#7d8898" font-size="15">Never five. Loading four playbooks spreads attention across four and applies none.</text>
<g filter="url(#routerflow-lift)"><rect x="36" y="122" width="262" height="218" rx="12" fill="#131822" stroke="#222a36"/></g>
<g transform="translate(36,122)" clip-path="url(#routerflow-cap)"><rect width="262" height="3" fill="#FF9600"/></g>
<text x="52" y="149" fill="#FF9600" font-size="11" font-weight="700" letter-spacing="1.1">STEP 1</text>
<text x="52" y="175" fill="#e9eef5" font-size="19" font-weight="700">Gate</text>
<text x="52" y="197" fill="#7d8898" font-size="13">first match wins, then stop</text>
<text x="52" y="224" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UI craft</text>
<text x="282" y="224" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hand off</text>
<text x="52" y="248" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">named a skill</text>
<text x="282" y="248" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">go there</text>
<text x="52" y="272" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">wants the map</text>
<text x="282" y="272" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">map.md</text>
<text x="52" y="296" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">trivia</text>
<text x="282" y="296" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">decline</text>
<text x="52" y="320" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spans 3+</text>
<text x="282" y="320" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chains.md</text>
<g filter="url(#routerflow-lift)"><rect x="322" y="122" width="262" height="218" rx="12" fill="#131822" stroke="#222a36"/></g>
<g transform="translate(322,122)" clip-path="url(#routerflow-cap)"><rect width="262" height="3" fill="#1CB0F6"/></g>
<text x="338" y="149" fill="#1CB0F6" font-size="11" font-weight="700" letter-spacing="1.1">STEP 2</text>
<text x="338" y="175" fill="#e9eef5" font-size="19" font-weight="700">Posture</text>
<text x="338" y="197" fill="#7d8898" font-size="13">decides the shape of the answer</text>
<text x="338" y="224" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Diagnose</text>
<text x="568" y="224" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mechanism</text>
<text x="338" y="248" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Build</text>
<text x="568" y="248" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the thing</text>
<text x="338" y="272" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Decide</text>
<text x="568" y="272" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a call</text>
<text x="338" y="296" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Critique</text>
<text x="568" y="296" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">findings</text>
<text x="338" y="320" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Explain</text>
<text x="568" y="320" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">then stop</text>
<g filter="url(#routerflow-lift)"><rect x="608" y="122" width="262" height="218" rx="12" fill="#131822" stroke="#222a36"/></g>
<g transform="translate(608,122)" clip-path="url(#routerflow-cap)"><rect width="262" height="3" fill="#58CC02"/></g>
<text x="624" y="149" fill="#58CC02" font-size="11" font-weight="700" letter-spacing="1.1">STEP 3</text>
<text x="624" y="175" fill="#e9eef5" font-size="19" font-weight="700">Family → skill</text>
<text x="624" y="197" fill="#7d8898" font-size="13">rows are phrasings, not labels</text>
<text x="624" y="248" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8 families</text>
<text x="854" y="248" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">44 skills</text>
<text x="616.2" y="296" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">“day-3 churn”</text>
<text x="854" y="296" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">retention</text>
<g filter="url(#routerflow-lift)"><rect x="894" y="122" width="262" height="218" rx="12" fill="#131822" stroke="#222a36"/></g>
<g transform="translate(894,122)" clip-path="url(#routerflow-cap)"><rect width="262" height="3" fill="#CE82FF"/></g>
<text x="910" y="149" fill="#CE82FF" font-size="11" font-weight="700" letter-spacing="1.1">STEP 4</text>
<text x="910" y="175" fill="#e9eef5" font-size="19" font-weight="700">Answer</text>
<text x="910" y="197" fill="#7d8898" font-size="13">one or two skills</text>
<text x="910" y="248" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">every answer</text>
<text x="1140" y="248" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cites a node</text>
<text x="910" y="272" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">translate.md</text>
<text x="1140" y="272" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mandatory</text>
<text x="910" y="296" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ends in</text>
<text x="1140" y="296" fill="#e9eef5" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">your product</text>
<text x="310.0" y="234.8" fill="#7d8898" font-size="13" text-anchor="middle">→</text>
<text x="596.0" y="234.8" fill="#7d8898" font-size="13" text-anchor="middle">→</text>
<text x="882.0" y="234.8" fill="#7d8898" font-size="13" text-anchor="middle">→</text>
<rect x="36" y="376" width="1120" height="64" rx="12" fill="#131822" stroke="#FF9600" stroke-opacity="0.32"/>
<g transform="translate(36,376)" clip-path="url(#routerflow-banner-cap)"><rect width="3" height="64" fill="#FF9600"/></g>
<text x="55" y="401" fill="#FF9600" font-size="11" font-weight="700" letter-spacing="1.1">GATE ROW 1 — THIS PACK DOES NOT OWN PIXEL CRAFT</text>
<text x="55" y="423" fill="#7d8898" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">easing · duration · contrast · tokens · component behaviour → design-engineering</text>
</svg>
